name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: ament lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          rosdep update
          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --packages-select gazebo_huldra_platform_description \
            --symlink-install \
            --event-handlers console_direct+

      - name: Run linters
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select gazebo_huldra_platform_description \
            --event-handlers console_direct+

      - name: Report lint results
        if: always()
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose
